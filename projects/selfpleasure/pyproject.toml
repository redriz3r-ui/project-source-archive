[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "selfpleasure"
version = "0.1.0"
description = "Local-first, safety-oriented computer-vision device control"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn==0.53.0",
    "buttplug==1.0.0",
    "mediapipe==1.1.0",
    "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
release = [
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["*.html", "*.css", "*.js"]
