<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love The Captive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Jazz Tuesday</h1>

    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
        <button id="prevMonth" style="font-size: 1.5rem; background: none; border: none; color: white; cursor: pointer;">&#9664;</button>
        <div id="monthLabel" style="font-size: 24px; font-weight: bold;"></div>
        <button id="nextMonth" style="font-size: 1.5rem; background: none; border: none; color: white; cursor: pointer;">&#9654;</button>
    </div>

    <div id="calendar"></div>

    <h2>Upcoming Events</h2>
<div id="eventList"></div>



<!-- Modal for Adding/Editing Events -->
<div id="eventModal" style="display: none;">
    <div class="modal-content">
        <h2>Add/Edit Event</h2>

                <!-- Error message area -->
                <div id="errorMessage" style="color: red; margin-bottom: 10px; display: none;"></div>


        <label for="eventTitle">Event Title</label>
        <input type="text" id="eventTitle" placeholder="Event Title" />
        <label for="eventVenue">Venue</label>
        <input type="text" id="eventVenue" placeholder="Venue" />

        <label for="eventTime">Event Time</label>
        <div>
        <select id="eventHour">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
        <select id="eventMinute">
            <option value="00">00</option>
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="45">45</option>
        </select>
        <select id="eventPeriod">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
        </select>
    </div>  
        <label for="eventDescription">Event Description</label>
        <textarea id="eventDescription" placeholder="Event Description"></textarea>
        <div class="button-container">
            <div class="button-container">
                <button id="saveEvent" class="action-button">Save Event</button>
                <button id="deleteEvent" class="action-button" style="display: none;">Delete Event</button>
            </div>
            <label for="eventInstagramUrl">Band's Instagram URL</label>
<input type="url" id="eventInstagramUrl" placeholder="https://instagram.com/bandname" />
    </div>
        <button onclick="closeEventModal()" class="close-button">X</button>
    </div>

    <!-- View Event Modal -->
<div id="viewEventModal" style="display: none;">
    <div class="modal-content">
        <h2>View Event</h2>
        <p><strong>Title:</strong> <span id="viewEventTitle"></span></p>
        <p><strong>Time:</strong> <span id="viewEventTime"></span></p>
        <p><strong>Description:</strong> <span id="viewEventDescription"></span></p>
        <button onclick="closeViewEventModal()">Close</button>
    </div>
</div>

</div>
<div class="container">
    <header class="festival-header">
        <h1>Jazz Tuesday Bands</h1>
        <p>Explore the bands that have shared the stage!</p>
    </header>

    <!-- Container where the bands will be added -->
    <section id="bandList" class="band-list"></section>
</div>

    <script src="app.js"></script>
</body>
</html>
