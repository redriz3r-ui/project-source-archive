[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-architecture-lab"
version = "0.1.0"
description = "Offline, privacy-first HAR architecture research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
site-architecture-lab = "site_architecture_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
