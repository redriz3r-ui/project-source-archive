<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveLock</title>
  <style>
    :root{color-scheme:dark}body{font:17px/1.65 system-ui,sans-serif;background:#101721;color:#e6edf5;margin:0}main{max-width:640px;margin:15vh auto;padding:30px}.mark{width:52px;height:52px;display:grid;place-items:center;border:1px solid #426d61;border-radius:16px;background:#173329;color:#9de8d0;font-size:25px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.05em;color:#9de8d0;font-weight:650;margin:0 0 20px}h1{font-size:36px;line-height:1.25;letter-spacing:-.025em;overflow-wrap:anywhere;margin:0 0 18px}#selection{white-space:pre-line;color:#b9c8d8;max-width:520px;margin:0}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true">Ⅱ</div>
    <p id="protection" class="eyebrow">LIVELOCK</p>
    <h1 id="heading">This website is blocked.</h1>
    <p id="selection">Please check LiveLock for the current status.</p>
  </main>
  <script type="module" src="/src/blocked/main.ts"></script>
</body>
</html>
