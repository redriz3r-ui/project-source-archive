name: Verify extension
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: livelock
          path: |
            dist/
            dist-dev/
            artifacts/
